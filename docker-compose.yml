services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: specguard
      POSTGRES_PASSWORD: specguard
      POSTGRES_DB: specguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specguard"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      SPECGUARD_DATABASE_URL: postgresql+psycopg2://specguard:specguard@db:5432/specguard
      SPECGUARD_CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
