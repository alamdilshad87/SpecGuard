services:
  db:
    # PostgreSQL 16 with the pgvector extension available (used for semantic search)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: specguard
      POSTGRES_PASSWORD: specguard
      POSTGRES_DB: specguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specguard"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      SPECGUARD_DATABASE_URL: postgresql+psycopg2://specguard:specguard@db:5432/specguard
      SPECGUARD_CORS_ORIGINS: '["http://localhost:5173"]'
      # Optional: any OpenAI-compatible chat API for /versions/{id}/ask (empty = offline answers)
      SPECGUARD_LLM_BASE_URL: ${SPECGUARD_LLM_BASE_URL:-}
      SPECGUARD_LLM_API_KEY: ${SPECGUARD_LLM_API_KEY:-}
      SPECGUARD_LLM_MODEL: ${SPECGUARD_LLM_MODEL:-}
      # .NET Roslyn scanner used for C# files in drift scans
      SPECGUARD_CSHARP_SCANNER_URL: http://scanner:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      scanner:
        condition: service_started

  scanner:
    build: ./scanner-dotnet
    expose:
      - "8080"

  ui:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
