name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: specguard
          POSTGRES_PASSWORD: specguard
          POSTGRES_DB: specguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specguard"
          --health-interval 5s
          --health-retries 10
    env:
      # Also run the migration tests against real PostgreSQL
      SPECGUARD_TEST_POSTGRES_URL: postgresql+psycopg2://specguard:specguard@localhost:5432/specguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  scanner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner-dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
