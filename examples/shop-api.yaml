openapi: 3.0.3
info:
  title: Shop API
  version: 1.0.0
  description: >
    A storefront backend: customer accounts, catalogue and stock, carts, orders, payments,
    shipping, webhooks and reporting. Used as the corpus for SpecGuard's retrieval evaluation.
servers:
  - url: https://api.shop.example/v1
tags:
  - name: auth
  - name: customers
  - name: catalog
  - name: inventory
  - name: reviews
  - name: carts
  - name: orders
  - name: payments
  - name: shipping
  - name: webhooks
  - name: reports

paths:
  /auth/token:
    post:
      tags: [auth]
      operationId: createAccessToken
      summary: Create an access token
      description: Exchange a client ID and client secret for a short-lived bearer token (OAuth 2.0 client credentials).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, clientSecret]
              properties:
                clientId: {type: string}
                clientSecret: {type: string}
                scope: {type: string, description: Space-separated scopes}
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Token"}
        "401": {$ref: "#/components/responses/Error"}

  /auth/token/refresh:
    post:
      tags: [auth]
      operationId: refreshAccessToken
      summary: Refresh an access token
      description: Use a refresh token to obtain a new access token before the current one expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: {type: string}
      responses:
        "200":
          description: New token issued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Token"}
        "401": {$ref: "#/components/responses/Error"}

  /customers:
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Register a customer
      description: Create a customer account. Email addresses must be unique.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewCustomer"}
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Customer"}
        "409": {$ref: "#/components/responses/Error"}

  /customers/{customerId}:
    parameters:
      - {$ref: "#/components/parameters/CustomerId"}
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Get a customer
      responses:
        "200":
          description: The customer
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Customer"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      tags: [customers]
      operationId: updateCustomer
      summary: Update a customer profile
      description: Partially update name, email, phone or marketing preferences.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                email: {type: string, format: email}
                phone: {type: string}
                marketingOptIn: {type: boolean}
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Customer"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [customers]
      operationId: deleteCustomer
      summary: Delete a customer account
      description: Permanently removes the account and anonymises personal data, as required by GDPR. Order history is retained without personal details.
      responses:
        "204": {description: Account deleted}
        "404": {$ref: "#/components/responses/Error"}

  /customers/{customerId}/addresses:
    parameters:
      - {$ref: "#/components/parameters/CustomerId"}
    get:
      tags: [customers]
      operationId: listAddresses
      summary: List a customer's addresses
      description: Shipping and billing addresses saved on the account.
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Address"}
    post:
      tags: [customers]
      operationId: addAddress
      summary: Add an address
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Address"}
      responses:
        "201":
          description: Address saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Address"}

  /products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: List products
      description: Browse and search the catalogue with filters, sorting and pagination.
      parameters:
        - {name: q, in: query, description: Free-text search over name and description, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: minPrice, in: query, schema: {type: number, minimum: 0}}
        - {name: maxPrice, in: query, schema: {type: number, minimum: 0}}
        - {name: sort, in: query, schema: {type: string, enum: [price_asc, price_desc, newest, rating]}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200":
          description: A page of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Product"}
                  total: {type: integer}
    post:
      tags: [catalog]
      operationId: createProduct
      summary: Create a product
      description: Add a product to the catalogue. Requires the catalog:write scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewProduct"}
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Product"}
        "400": {$ref: "#/components/responses/Error"}

  /products/{productId}:
    parameters:
      - {$ref: "#/components/parameters/ProductId"}
    get:
      tags: [catalog]
      operationId: getProduct
      summary: Get a product
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Product"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [catalog]
      operationId: replaceProduct
      summary: Replace a product
      description: Overwrite every field of a product.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewProduct"}
      responses:
        "200":
          description: Product replaced
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Product"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [catalog]
      operationId: archiveProduct
      summary: Archive a product
      description: Hides the product from the storefront. Existing orders keep referring to it.
      responses:
        "204": {description: Product archived}
        "404": {$ref: "#/components/responses/Error"}

  /categories:
    get:
      tags: [catalog]
      operationId: listCategories
      summary: List categories
      description: The category tree used to organise products.
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Category"}

  /products/{productId}/inventory:
    parameters:
      - {$ref: "#/components/parameters/ProductId"}
    get:
      tags: [inventory]
      operationId: getInventory
      summary: Get stock levels
      description: Quantity on hand and reserved quantity per warehouse.
      responses:
        "200":
          description: Stock levels
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/StockLevel"}
    patch:
      tags: [inventory]
      operationId: adjustInventory
      summary: Adjust stock
      description: Increase or decrease the quantity on hand in one warehouse, with a reason code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, delta, reason]
              properties:
                warehouseId: {type: string}
                delta: {type: integer, description: Positive to add units, negative to remove}
                reason: {type: string, enum: [restock, damage, correction, return]}
      responses:
        "200":
          description: Updated stock level
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StockLevel"}

  /products/{productId}/reviews:
    parameters:
      - {$ref: "#/components/parameters/ProductId"}
    get:
      tags: [reviews]
      operationId: listReviews
      summary: List reviews
      parameters:
        - {name: minRating, in: query, schema: {type: integer, minimum: 1, maximum: 5}}
        - {$ref: "#/components/parameters/Page"}
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Review"}
    post:
      tags: [reviews]
      operationId: createReview
      summary: Submit a review
      description: Only customers with a delivered order containing the product may review it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: {type: integer, minimum: 1, maximum: 5}
                title: {type: string, maxLength: 120}
                body: {type: string, maxLength: 4000}
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Review"}
        "403": {$ref: "#/components/responses/Error"}

  /carts:
    post:
      tags: [carts]
      operationId: createCart
      summary: Create a cart
      description: Carts can be anonymous and attached to a customer later.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId: {type: string}
                currency: {type: string, example: EUR}
      responses:
        "201":
          description: Cart created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}

  /carts/{cartId}:
    parameters:
      - {$ref: "#/components/parameters/CartId"}
    get:
      tags: [carts]
      operationId: getCart
      summary: Get a cart
      description: Line items with subtotal, discounts, tax and grand total.
      responses:
        "200":
          description: The cart
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}
        "404": {$ref: "#/components/responses/Error"}

  /carts/{cartId}/items:
    parameters:
      - {$ref: "#/components/parameters/CartId"}
    post:
      tags: [carts]
      operationId: addCartItem
      summary: Add an item to a cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: {type: string}
                quantity: {type: integer, minimum: 1}
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}
        "409": {$ref: "#/components/responses/Error"}

  /carts/{cartId}/items/{itemId}:
    parameters:
      - {$ref: "#/components/parameters/CartId"}
      - {name: itemId, in: path, required: true, schema: {type: string}}
    delete:
      tags: [carts]
      operationId: removeCartItem
      summary: Remove an item from a cart
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}

  /carts/{cartId}/coupons:
    parameters:
      - {$ref: "#/components/parameters/CartId"}
    post:
      tags: [carts]
      operationId: applyCoupon
      summary: Apply a coupon code
      description: Validates the code and recalculates discounts. One coupon per cart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}
        "422": {$ref: "#/components/responses/Error"}

  /orders:
    post:
      tags: [orders]
      operationId: placeOrder
      summary: Place an order
      description: Converts a cart into an order and reserves stock. Send an Idempotency-Key header so retries do not create duplicate orders.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cartId, shippingAddressId]
              properties:
                cartId: {type: string}
                shippingAddressId: {type: string}
                billingAddressId: {type: string}
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "409": {$ref: "#/components/responses/Error"}
    get:
      tags: [orders]
      operationId: listOrders
      summary: List orders
      parameters:
        - {name: status, in: query, schema: {$ref: "#/components/schemas/OrderStatus"}}
        - {name: customerId, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/Page"}
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Order"}

  /orders/{orderId}:
    parameters:
      - {$ref: "#/components/parameters/OrderId"}
    get:
      tags: [orders]
      operationId: getOrder
      summary: Get an order
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "404": {$ref: "#/components/responses/Error"}

  /orders/{orderId}/cancel:
    parameters:
      - {$ref: "#/components/parameters/OrderId"}
    post:
      tags: [orders]
      operationId: cancelOrder
      summary: Cancel an order
      description: Allowed only while the order status is pending or paid; releases reserved stock and refunds any payment.
      responses:
        "200":
          description: Cancelled order
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "409": {$ref: "#/components/responses/Error"}

  /orders/{orderId}/payments:
    parameters:
      - {$ref: "#/components/parameters/OrderId"}
    post:
      tags: [payments]
      operationId: createPayment
      summary: Pay for an order
      description: Charge a tokenised card or wallet for the order total.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethodToken]
              properties:
                paymentMethodToken: {type: string}
      responses:
        "201":
          description: Payment captured
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Payment"}
        "402": {$ref: "#/components/responses/Error"}

  /payments/{paymentId}/refunds:
    parameters:
      - {name: paymentId, in: path, required: true, schema: {type: string}}
    post:
      tags: [payments]
      operationId: refundPayment
      summary: Refund a payment
      description: Full or partial refund. Omit amount to refund the remaining balance.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: {type: number, minimum: 0.01}
                reason: {type: string}
      responses:
        "201":
          description: Refund created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Refund"}
        "409": {$ref: "#/components/responses/Error"}

  /orders/{orderId}/shipments:
    parameters:
      - {$ref: "#/components/parameters/OrderId"}
    get:
      tags: [shipping]
      operationId: listShipments
      summary: List shipments for an order
      description: Each shipment has a carrier, tracking number and delivery status.
      responses:
        "200":
          description: Shipments
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Shipment"}

  /shipping/rates:
    get:
      tags: [shipping]
      operationId: getShippingRates
      summary: Quote shipping rates
      description: Available carriers and prices for a destination and parcel weight.
      parameters:
        - {name: country, in: query, required: true, description: ISO 3166-1 alpha-2 country code, schema: {type: string}}
        - {name: postalCode, in: query, schema: {type: string}}
        - {name: weightGrams, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Rates
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ShippingRate"}

  /webhooks:
    post:
      tags: [webhooks]
      operationId: createWebhook
      summary: Register a webhook
      description: Subscribe an HTTPS endpoint to events such as order.created, order.shipped or payment.refunded. Payloads are signed with HMAC-SHA256.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: {type: string, format: uri}
                events:
                  type: array
                  items: {type: string}
      responses:
        "201":
          description: Webhook registered
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Webhook"}

  /webhooks/{webhookId}:
    parameters:
      - {name: webhookId, in: path, required: true, schema: {type: string}}
    delete:
      tags: [webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook
      responses:
        "204": {description: Webhook deleted}
        "404": {$ref: "#/components/responses/Error"}

  /reports/sales:
    get:
      tags: [reports]
      operationId: getSalesReport
      summary: Sales report
      description: Gross sales, refunds, net revenue and order count over a date range.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: groupBy, in: query, schema: {type: string, enum: [day, week, month]}}
      responses:
        "200":
          description: Report rows
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SalesRow"}

components:
  parameters:
    CustomerId: {name: customerId, in: path, required: true, schema: {type: string}}
    ProductId: {name: productId, in: path, required: true, schema: {type: string}}
    CartId: {name: cartId, in: path, required: true, schema: {type: string}}
    OrderId: {name: orderId, in: path, required: true, schema: {type: string}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    Token:
      type: object
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
        expiresIn: {type: integer, description: Seconds until the access token expires}
    NewCustomer:
      type: object
      required: [email, name]
      properties:
        email: {type: string, format: email}
        name: {type: string}
        phone: {type: string}
    Customer:
      allOf:
        - $ref: "#/components/schemas/NewCustomer"
        - type: object
          properties:
            id: {type: string}
            createdAt: {type: string, format: date-time}
    Address:
      type: object
      required: [line1, city, country]
      properties:
        id: {type: string}
        line1: {type: string}
        city: {type: string}
        postalCode: {type: string}
        country: {type: string}
        type: {type: string, enum: [shipping, billing]}
    NewProduct:
      type: object
      required: [name, price, currency]
      properties:
        name: {type: string}
        description: {type: string}
        price: {type: number, minimum: 0}
        currency: {type: string}
        category: {type: string}
        sku: {type: string}
    Product:
      allOf:
        - $ref: "#/components/schemas/NewProduct"
        - type: object
          properties:
            id: {type: string}
            averageRating: {type: number}
            archived: {type: boolean}
    Category:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        parentId: {type: string}
    StockLevel:
      type: object
      properties:
        warehouseId: {type: string}
        onHand: {type: integer}
        reserved: {type: integer}
    Review:
      type: object
      properties:
        id: {type: string}
        rating: {type: integer}
        title: {type: string}
        body: {type: string}
        customerName: {type: string}
    Cart:
      type: object
      properties:
        id: {type: string}
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              productId: {type: string}
              quantity: {type: integer}
              unitPrice: {type: number}
        couponCode: {type: string}
        subtotal: {type: number}
        discount: {type: number}
        tax: {type: number}
        total: {type: number}
    OrderStatus:
      type: string
      enum: [pending, paid, shipped, delivered, cancelled]
    Order:
      type: object
      properties:
        id: {type: string}
        status: {$ref: "#/components/schemas/OrderStatus"}
        customerId: {type: string}
        total: {type: number}
        createdAt: {type: string, format: date-time}
    Payment:
      type: object
      properties:
        id: {type: string}
        amount: {type: number}
        status: {type: string, enum: [captured, failed]}
    Refund:
      type: object
      properties:
        id: {type: string}
        paymentId: {type: string}
        amount: {type: number}
    Shipment:
      type: object
      properties:
        id: {type: string}
        carrier: {type: string}
        trackingNumber: {type: string}
        status: {type: string, enum: [label_created, in_transit, delivered]}
    ShippingRate:
      type: object
      properties:
        carrier: {type: string}
        service: {type: string}
        price: {type: number}
        estimatedDays: {type: integer}
    Webhook:
      type: object
      properties:
        id: {type: string}
        url: {type: string}
        events:
          type: array
          items: {type: string}
        secret: {type: string, description: Used to verify the HMAC signature}
    SalesRow:
      type: object
      properties:
        period: {type: string}
        grossSales: {type: number}
        refunds: {type: number}
        netRevenue: {type: number}
        orders: {type: integer}
